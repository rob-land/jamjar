app-id: land.rob.Jamjar
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: jamjar

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets
  - --own-name=org.mpris.MediaPlayer2.land.rob.Jamjar
  - --own-name=org.gnome.Shell.SearchProvider.Jamjar
  - --filesystem=xdg-music:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - /share/vala
  - '*.la'
  - '*.a'

modules:
  - name: blueprint-compiler
    buildsystem: meson
    cleanup: ['*']
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.16.0

  # Generated by:
  #   flatpak run --command=python3 org.gnome.Sdk//50 \
  #     flatpak-pip-generator aiohttp python-zeroconf dbus-next \
  #     --output flatpak/python3-modules
  # The output module name is "python3-aiohttp_python_zeroconf_dbus_next".
  - python3-modules.json

  - name: jamjar
    buildsystem: meson
    sources:
      - type: dir
        path: ..
